name: Review Pull Request

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
    - name: Call Lambda for Test Evaluation
      run: |
        curl -X GET "https://<API_GATEWAY_ID>.execute-api.<AWS_REGION>.amazonaws.com/review?action=evaluate_tests&pr_number=${{ github.event.pull_request.number }}"

    - name: Call Lambda for Code Reuse Evaluation
      run: |
        curl -X GET "https://<API_GATEWAY_ID>.execute-api.<AWS_REGION>.amazonaws.com/review?action=evaluate_reuse&pr_number=${{ github.event.pull_request.number }}"

    - name: Call Lambda for User Story Alignment
      run: |
        curl -X GET "https://<API_GATEWAY_ID>.execute-api.<AWS_REGION>.amazonaws.com/review?action=evaluate_story&pr_number=${{ github.event.pull_request.number }}"

    - name: Call Lambda to Generate Documentation
      run: |
        curl -X GET "https://<API_GATEWAY_ID>.execute-api.<AWS_REGION>.amazonaws.com/review?action=generate_docs&pr_number=${{ github.event.pull_request.number }}"
